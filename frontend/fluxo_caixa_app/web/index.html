<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fluxo de Caixa — Quitandas da Badia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fluxo de Caixa">
  <link rel="apple-touch-icon" href="logo.jpg">

  <!-- Favicon: logo da marca -->
  <link rel="icon" type="image/jpeg" href="logo.jpg"/>

  <title>Fluxo de Caixa — Quitandas da Badia</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background-color: #BE5E24; }

    /* Tela de carregamento com a marca — visível antes de o Flutter renderizar. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #BE5E24;
      z-index: 999999;
      transition: opacity 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #splash.oculto { opacity: 0; pointer-events: none; }

    #splash .logo-anel {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      animation: pulsa 1.8s ease-in-out infinite;
    }
    #splash .logo-anel img {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
    }
    #splash .titulo {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      margin-top: 22px;
      letter-spacing: 0.3px;
    }
    #splash .sub {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      margin-top: 4px;
    }
    #splash .barra {
      margin-top: 26px;
      width: 46px;
      height: 46px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: gira 0.9s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
    @keyframes pulsa {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .logo-anel, #splash .barra { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-anel"><img src="logo.jpg" alt="Quitandas da Badia" /></div>
    <div class="titulo">Fluxo de Caixa</div>
    <div class="sub">Quitandas da Badia</div>
    <div class="barra" role="progressbar" aria-label="Carregando"></div>
  </div>

  <script>
    // Remove a tela de carregamento assim que o Flutter desenha o primeiro quadro.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) {
        s.classList.add('oculto');
        setTimeout(function () { s.remove(); }, 450);
      }
    });
  </script>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load();
  </script>

  <script>
    // Watchdog: se a superfície de render do Flutter sumir por >3s, recarrega a
    // página (rota preservada pelo hash; login preservado). Rede de segurança
    // contra qualquer falha de render.
    (function () {
      var strikes = 0;
      setInterval(function () {
        var gp = document.querySelector('flt-glass-pane');
        var sr = gp && gp.shadowRoot;
        if (!sr) { strikes = 0; return; }
        var temSuperficie = sr.querySelector('canvas, picture, img, flt-canvas-container *');
        if (!temSuperficie) {
          strikes++;
          if (strikes >= 2 && document.visibilityState === 'visible') { location.reload(); }
        } else {
          strikes = 0;
        }
      }, 1500);
    })();
  </script>
</body>
</html>
